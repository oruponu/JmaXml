name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check that the tag matches the package version
        run: |
          version=$(dotnet msbuild src/JmaXml/JmaXml.csproj -getProperty:PackageVersion)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi
      - name: Extract the release notes
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no notes for ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - run: dotnet run --project tools/JmaXml.Generator --configuration Release --no-build -- --check
      - run: dotnet pack src/JmaXml --configuration Release --no-build --output artifacts
      - uses: NuGet/login@v1
        id: login
        with:
          user: oruponu
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

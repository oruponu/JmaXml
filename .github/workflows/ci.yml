name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - run: dotnet run --project tools/JmaXml.Generator --configuration Release --no-build -- --check
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet pack src/JmaXml --configuration Release --no-build --output artifacts
